[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["tisty", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
folio-envelope = { path = "crates/envelope", default-features = false }
folio-server = { path = "crates/server" }
tisty-markdown = { path = "tisty/crates/tisty-markdown", default-features = false }
tisty-share-proto = { path = "tisty/crates/tisty-share-proto", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = { version = "0.2", features = ["serde"] }
toml = "1.1"
rusqlite = { version = "0.41", features = ["bundled"] }
thiserror = "2"
sha2 = "0.11"
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
scrypt = { version = "0.12", default-features = false }
rand_core = { version = "0.9", features = ["os_rng"] }
base64 = "0.23"
zeroize = "1"
hmac = { version = "0.13", features = ["zeroize"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
too_many_lines = "deny"

[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3

[profile.dev.package.universal-hash]
opt-level = 3

[profile.release]
lto = "thin"
strip = true

[profile.folio-wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.release.package.folio-worker]
strip = false
