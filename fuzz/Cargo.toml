[package]
name = "folio-fuzz"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "=1.5.0", features = ["derive"] }
folio-envelope = { path = "../crates/envelope" }
jiff = "0.2"
libfuzzer-sys = "=0.4.13"
tisty-share-proto = { path = "../tisty/crates/tisty-share-proto" }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "envelope_read"
path = "fuzz_targets/envelope_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "envelope_tamper"
path = "fuzz_targets/envelope_tamper.rs"
test = false
doc = false
bench = false
