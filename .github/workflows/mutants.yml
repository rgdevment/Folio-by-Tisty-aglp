name: Mutants

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # `paths` on the trigger leaves a required check unreported for good; a skipped job counts as met.
  changes:
    name: what the branch touched
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mutable: ${{ steps.look.outputs.mutable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: look
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          # A dependency bump changes no line of ours, even when it touches a crate's manifest.
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "mutable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          watched='^(crates/(envelope|server)/src/|\.github/workflows/mutants\.yml$)'
          from=$(git merge-base "$BASE" HEAD)
          if git diff --name-only --diff-filter=d "$from" HEAD | grep -qE "$watched"; then
            echo "mutable=true" >> "$GITHUB_OUTPUT"
          else
            echo "mutable=false" >> "$GITHUB_OUTPUT"
          fi

  crates-on-the-branch:
    name: crates / the lines this branch changed
    needs: changes
    if: needs.changes.outputs.mutable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: true

      - name: What the branch changed in the two crates
        id: touched
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          from=$(git merge-base "$BASE" HEAD)
          git diff "$from" -- crates/envelope/src crates/server/src > branch.diff
          if [ -s branch.diff ]; then echo "any=yes" >> "$GITHUB_OUTPUT"; fi

      - uses: ./.github/actions/toolchain
        if: steps.touched.outputs.any == 'yes'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: false
        if: steps.touched.outputs.any == 'yes'
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-mutants
        if: steps.touched.outputs.any == 'yes'

      - name: A mutant that lives on a line this branch wrote
        id: run
        if: steps.touched.outputs.any == 'yes'
        run: |
          set +e
          cargo mutants --in-diff branch.diff -p folio-envelope -p folio-server --all-features -j 2
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: What survived
        if: always() && steps.touched.outputs.any == 'yes'
        env:
          CODE: ${{ steps.run.outputs.code }}
          TITLE: The lines this branch changed
        run: bash scripts/mutants-report.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.touched.outputs.any == 'yes'
        with:
          name: mutants-branch-crates
          path: mutants.out/
          retention-days: 7
