name: Mutants sweep

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutants-sweep
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  crate:
    name: ${{ matrix.crate }} / every mutant
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        crate: [folio-envelope, folio-server]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-mutants

      - name: Every mutant the crate carries
        id: run
        env:
          CRATE: ${{ matrix.crate }}
        run: |
          set +e
          cargo mutants -p "$CRATE" --all-features -j 2
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: What survived
        if: always()
        env:
          CODE: ${{ steps.run.outputs.code }}
          TITLE: ${{ matrix.crate }}
        run: bash scripts/mutants-report.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-${{ matrix.crate }}
          path: mutants.out/
          retention-days: 14
