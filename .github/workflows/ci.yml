name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/toolchain
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: rustfmt --check --edition 2021 fuzz/fuzz_targets/*.rs

  test:
    name: clippy + tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/toolchain
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p folio-envelope --features mint,pictures

  wasm:
    name: wasm32 builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/toolchain
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: worker-build@0.8.7
      - run: cargo check -p folio-envelope --no-default-features --target wasm32-unknown-unknown
      - run: cargo check -p folio-server --target wasm32-unknown-unknown
      - run: cargo clippy -p folio-worker --target wasm32-unknown-unknown
      - run: cargo clippy -p folio-wasm --target wasm32-unknown-unknown
      - name: The Worker bundles as wrangler deploys it
        working-directory: crates/worker
        run: worker-build --release

  fuzz:
    name: fuzz targets build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/toolchain
      - run: cargo check --manifest-path fuzz/Cargo.toml --bins

  page:
    name: page
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/page
        with:
          checked: "true"

  prose:
    name: markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run lint:md

  audit:
    name: advisories + licences
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources
      # A warning on a pull request, like npm's: an advisory published today would otherwise fail every one at once.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          command: check advisories

  npm-audit:
    name: npm advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      # A warning, never a red check: an advisory published today would otherwise fail every pull request at once.
      - name: Advisories at moderate or above, in the page and in the Worker's tooling
        run: |
          for dir in . crates/worker; do
            npm audit --prefix "$dir" --package-lock-only --json > "$RUNNER_TEMP/audit.json" || true
            if ! jq -e '.vulnerabilities' "$RUNNER_TEMP/audit.json" > /dev/null; then
              echo "::warning::npm audit gave no report for $dir/package-lock.json"
              continue
            fi
            found=$(jq -r '[.vulnerabilities[].via[] | objects
              | select(.severity != "low" and .severity != "info") | "\(.severity) \(.name) \(.url)"]
              | unique[]' "$RUNNER_TEMP/audit.json")
            if [ -n "$found" ]; then
              echo "$found"
              echo "::warning::npm advisories at moderate or above in $dir/package-lock.json"
            else
              echo "$dir/package-lock.json: nothing at moderate or above"
            fi
          done

  coverage:
    name: coverage
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/toolchain
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov
      - name: The crates, measured
        run: |
          cargo llvm-cov --workspace --all-features --lcov --output-path lcov-rust.info
          sed -i "s|^SF:$PWD/|SF:|" lcov-rust.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: lcov-rust.info
          retention-days: 7
