name: The share page, built
description: Builds the page that reads a Tisty Share link into web/dist, wasm and all.

inputs:
  checked:
    description: Also typecheck, lint and test the page between its wasm and its build.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: ./.github/actions/toolchain
      with:
        targets: wasm32-unknown-unknown
    - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
      with:
        tool: wasm-bindgen@0.2.129
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        package-manager-cache: false
    - shell: bash
      run: npm ci --ignore-scripts
    - shell: bash
      working-directory: web
      run: npm run wasm
    - if: inputs.checked == 'true'
      shell: bash
      working-directory: web
      run: |
        npm run typecheck
        npm run lint
        npm test
    - shell: bash
      working-directory: web
      run: |
        npm run build
        npm run budget
