[package]
name = "folio-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# The Worker is the cdylib; the rlib lets the API be tested on the machine that builds it.
crate-type = ["cdylib", "rlib"]

[dependencies]
base64.workspace = true
folio-envelope.workspace = true
folio-server.workspace = true
serde.workspace = true
serde_json.workspace = true
tisty-share-proto.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = { version = "0.3", default-features = false }
# Pinned with worker-build (the CI's wasm job and wrangler.toml), whose shim has to match this crate's version.
worker = { version = "=0.8.7", features = ["d1"] }

[dev-dependencies]
rusqlite.workspace = true
toml.workspace = true
# Envelopes are sealed in the tests as a Tisty would seal them.
folio-envelope = { workspace = true, features = ["mint"] }
folio-server = { workspace = true, features = ["testing"] }
