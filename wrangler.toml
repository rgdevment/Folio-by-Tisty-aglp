name = "folio-private"
main = "src/private/index.ts"
compatibility_date = "2026-08-01"
workers_dev = false

# tisty.cl needs a proxied DNS record for this route to answer.
routes = [{ pattern = "tisty.cl/*", zone_name = "tisty.cl" }]

# Free and uncounted (decision 109): only the API wakes the Worker, and any other path gets the page.
[assets]
directory = "./dist/page"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Beside D1 and R2 in eastern North America, so a read's queries in a row cross the continent once (decision 94 bis).
[placement]
region = "aws:us-east-1"

[[d1_databases]]
binding = "DB"
database_name = "folio-private"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ENVELOPES"
bucket_name = "folio-private-envelopes"

[[ratelimits]]
name = "READS"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# BILLING_DAY is the plan's renewal day, or 28 if it falls later (decision 118).
[vars]
BILLING_DAY = ""
CF_ACCOUNT_ID = ""
CF_ZONE_ID = ""
CF_RULESET_ID = ""
CF_RULE_ID = ""
CF_DATABASE_ID = ""
CF_SCRIPT_NAME = "folio-private"
CF_BUCKET_NAME = "folio-private-envelopes"

[triggers]
crons = ["*/15 * * * *", "0 * * * *", "0 0,12 * * *", "0 4 * * 0"]

# What the code logs is kept, and the request itself never is (decision 98).
[observability]
enabled = true

[observability.logs]
invocation_logs = false
