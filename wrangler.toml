name = "folio-private"
main = "src/private/index.ts"
compatibility_date = "2026-08-01"
workers_dev = false

# Beside D1 and R2 in eastern North America, so a read's queries in a row cross the continent once (decision 94 bis).
[placement]
region = "aws:us-east-1"

[[d1_databases]]
binding = "DB"
database_name = "folio-private"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ENVELOPES"
bucket_name = "folio-private-envelopes"

# Reads cost no writes here. It counts by location and is only a brake against floods (decision 116).
[[ratelimits]]
name = "READS"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Filled in when the account exists. BILLING_DAY is the plan's renewal day, or 28 if it falls later (decision 118).
[vars]
BILLING_DAY = ""
CF_ACCOUNT_ID = ""
CF_ZONE_ID = ""
CF_RULESET_ID = ""
CF_RULE_ID = ""
CF_DATABASE_ID = ""
CF_SCRIPT_NAME = "folio-private"
CF_BUCKET_NAME = "folio-private-envelopes"

[triggers]
crons = ["*/15 * * * *", "0 * * * *", "0 4 * * 0"]

# What the code logs is kept, and the request itself never is (decision 98).
[observability]
enabled = true

[observability.logs]
invocation_logs = false
